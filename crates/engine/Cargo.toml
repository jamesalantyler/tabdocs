[package]
name = "tabdocs-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TabDocs engine: session, selection, undo, the command registry (every action is a command), Word's command catalog, file I/O dispatch"

[lints]
workspace = true

[dependencies]
tabdocs-geom = { workspace = true }
tabdocs-doc = { workspace = true }
tabdocs-fonts = { workspace = true }
tabdocs-layout = { workspace = true }
tabdocs-render = { workspace = true }
tabdocs-proof = { workspace = true }
tabdocs-docx = { workspace = true }
tabdocs-docbin = { workspace = true }
tabdocs-pdf = { workspace = true }
tabdocs-formats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
regex-automata = { workspace = true }
image = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock for `now_iso` (`SystemTime::now()` panics on wasm32).
js-sys = "0.3"

[dev-dependencies]
zip = { workspace = true }
