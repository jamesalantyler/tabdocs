[package]
name = "tabdocs-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TabDocs egui front end (Word-style ribbon UI); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
tabdocs-geom = { workspace = true }
tabdocs-doc = { workspace = true }
tabdocs-fonts = { workspace = true }
tabdocs-layout = { workspace = true }
tabdocs-render = { workspace = true }
tabdocs-engine = { workspace = true }
tabdocs-zotero = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# The system's preferred interface languages (#8). Native: OS APIs; wasm: none (English).
sys-locale = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (`SystemTime::now()`/`Instant::now()` panic on wasm32).
js-sys = "0.3"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
image = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
