[package]
name = "tabdocs-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TabDocs rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
tabdocs-geom = { workspace = true }
tabdocs-doc = { workspace = true }
tabdocs-fonts = { workspace = true }
tabdocs-layout = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
