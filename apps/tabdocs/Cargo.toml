[package]
name = "tabdocs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "tabdocs"
description = "TabDocs desktop app"

[lints]
workspace = true

[dependencies]
tabdocs-doc = { workspace = true }
tabdocs-engine = { workspace = true }
tabdocs-ui-egui = { workspace = true }
# The control key file's location (shared with the MCP bridge).
tabdocs-control-key = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for tabdocs.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Finder double-click, Open With, Dock drops and `open -a TabDocs letter.docx` arrive as a
# kAEOpenDocuments Apple event, which winit 0.30 doesn't handle (#27). This audited crate (also used
# by PdfCraft and PhotoCraft) registers the handler (Objective-C interop needs unsafe, which our
# workspace forbids) behind a safe API. Pinned exactly: review the diff before bumping.
fmv-macos-events = "=0.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
# The control server's random key.
getrandom = "0.3"
